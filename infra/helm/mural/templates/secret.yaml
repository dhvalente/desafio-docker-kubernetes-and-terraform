# Credencial do Postgres. `required` faz o `helm install/upgrade` falhar
# explicitamente se ninguém passar postgres.password em runtime — evita que
# uma senha vazia (ou hardcoded) acabe indo parar aqui por acidente.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.postgresSecretName" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password é obrigatório — nunca commite em values.yaml; injete via --set ou deixe o Terraform gerar" .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.user .Values.postgres.password (include "mural.postgresServiceName" .) .Values.postgres.database | quote }}
