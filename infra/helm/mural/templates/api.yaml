# Fricção 2 resolvida aqui: liveness aponta para /healthz (processo vivo, não
# toca no banco); readiness aponta para /readyz (só passa com schema pronto).
# Se as duas apontassem para /readyz, o pod entraria em CrashLoop antes de o
# Job de migração terminar. failureThreshold maior na readiness dá tempo da
# migração rodar sem o pod ser marcado NotReady demais cedo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mural.apiServiceName" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "mural.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "mural.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.port }}
              name: http
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mural.postgresSecretName" . }}
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mural.apiServiceName" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    {{- include "mural.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: http
